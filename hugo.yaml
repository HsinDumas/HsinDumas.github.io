baseURL: https://hsindumas.github.io/
defaultContentLanguage: zh-cn
hasCJKLanguage: true
title: HsinDumas
theme: blowfish
timeZone: Asia/Shanghai
enableRobotsTXT: true
enableEmoji: true
summaryLength: 0

disableKinds: [taxonomy, term, RSS]

markup:
  goldmark:
    parser:
      wrapStandAloneImageWithinParagraph: false
      attribute:
        block: true
    renderer:
      unsafe: true
  highlight:
    noClasses: false

languages:
  zh-cn:
    locale: zh-cn
    label: 简体中文
    weight: 1
    title: HsinDumas
    params:
      displayName: 中文
      isoCode: zh-cn
      dateFormat: "2006-01-02"
      description: 人活着赖着一口氧气
      author:
        name: Hsin Dumas
        image: img/avatar.png
        headline: 人活着赖着一口氧气
        bio: Java / Spring Boot 开发。
        links:
          - github: https://github.com/HsinDumas
          - email: mailto:HsinDumas@gmail.com
    menu:
      main:
        - { name: 关于, pageRef: about, weight: 30 }
        - { identifier: github, url: "https://github.com/HsinDumas", weight: 40, params: { icon: github } }

params:
  colorScheme: blowfish
  defaultAppearance: dark
  autoSwitchAppearance: true
  enableSearch: false
  header:
    layout: fixed-fill-blur
  footer:
    showAppearanceSwitcher: true
    showScrollToTop: true
  homepage:
    layout: landing
    homepageImage: img/background.jpg
    showRecent: false
